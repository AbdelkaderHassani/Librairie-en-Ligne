<div class="row d-flex justify-content-center text-center" *ngIf="isLoaded && errMsg == ''">
    <div class="col-3 card-group" *ngFor="let category of categories">
        <div class="border border-1 m-2 my-5 card">
            <div style="height: 250px;">
                <img [src]="imgUrl + category.categoryImg" alt="{{category.name}} image" class="mt-3 justify-content-center" routerLink="/category/products/{{category._id}}">

            </div>
            <div class="card-body">
                <h5 class="card-title mt-3">{{category.name}}</h5>
            </div>
            <div class="card-body">
                <button routerLink="/category/single/edit/{{category._id}}" class="card-link btn btn-success">Modifier</button>
                <button routerLink="/category/single/delete/{{category._id}}" class="card-link btn btn-danger">Supprimer</button>
            </div>
        </div>
    </div>
</div>
