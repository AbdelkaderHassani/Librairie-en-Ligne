<div class="background-image">
    <div class="form-container">
        <form [formGroup]="editForm" (ngSubmit)="handleEdit()">
            <h1>Modifier Catégorie</h1>
            <div class="form-group">
                <label for="name">Nom de la catégorie</label>
                <input id="name" class="form-control" placeholder="Nom de la catégorie" formControlName="name">
                <div *ngIf="name?.invalid && (name?.dirty || name?.touched)" class="alert alert-danger">
                    <span *ngIf="name?.errors?.['required']">Le nom est requis</span>
                </div>
                <div class="alert alert-danger" *ngIf="errMsg.name">{{errMsg.name}}</div>
            </div>
            
            <div class="form-group">
                <label for="categoryImg">Image de la catégorie</label>
                <input id="categoryImg" type="file" class="form-control" name="categoryImg" (change)="onChangeImg($event)">
            </div>
            
            <div class="form-group">
                <button class="btn btn-info" type="submit">Modifier</button>
            </div>
        </form>
    </div>
</div>
